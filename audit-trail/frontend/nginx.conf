server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The dashboard is a single-page application: every route that is not a real
  # file must return index.html, or a refresh on /shipment/SHP-1 would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy to the API, mirroring the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events. Without these three the /api/stream/shipments
    # connection is buffered and the dashboard silently falls back to polling.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /health {
    proxy_pass http://api:4001;
    proxy_set_header Host $host;
  }
}
